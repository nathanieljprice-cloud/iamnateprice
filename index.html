<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nate Price</title>
<link rel="stylesheet" href="styles.css" />
<style>

  /* critical nav so preview never ships unstyled chrome */
  :root{--gutter:clamp(1.25rem,4.5vw,4rem);--chrome:90rem;--edge:max(var(--gutter),calc((100vw - var(--chrome)) / 2))}
  .site-nav{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:1.15rem var(--edge);pointer-events:none;font-family:ui-sans-serif,system-ui,sans-serif}
  .site-nav a{pointer-events:auto;color:rgba(242,239,232,.85);text-decoration:none}
  .nav-mark{font-family:Georgia,serif;font-size:1.05rem;color:#f2efe8;text-shadow:0 1px 18px rgba(0,0,0,.55)}
  .nav-links{display:flex;gap:1.5rem;list-style:none;margin:0;padding:0;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,239,232,.45)}
  .nav-links a:hover,.nav-links a[aria-current=page]{color:#f2efe8}
  .site-footer{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,239,232,.4)}
  .footer-socials{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem 1.15rem}
  .footer-socials a{color:inherit;text-decoration:none}
  .footer-socials a:hover{color:rgba(242,239,232,.85)}
  .footer-mark{margin:0}

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    cursor: auto;
  }
  .hero {
    position: absolute;
    inset: -5%;
    background: url("hero.jpg?v=20260826f") 42% 42% / cover no-repeat;
    transform: translate3d(var(--px, 0px), var(--py, 0px), 0) scale(1.03);
    will-change: transform;
    transition: transform 0.15s ease-out;
    filter: saturate(1.05) contrast(1.02);
  }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,0.5) 100%),
      linear-gradient(to top, rgba(5,7,11,0.5) 0%, transparent 26%);
  }
  .ui {
    position: absolute;
    left: var(--edge);
    bottom: 7.5vh;
    z-index: 5;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.85rem;
    max-width: calc(100% - (2 * var(--edge)));
  }
  .ui .role {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(2.15rem, 3.6vw, 3.2rem);
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.05;
    color: var(--bone);
    text-shadow: 0 2px 24px rgba(0,0,0,0.7);
  }
  .ui .chips {
    pointer-events: none;
    margin-top: 0;
  }
  .stage .grain {
    position: absolute;
    z-index: 3;
  }

  @media (min-width: 1400px) {
    .hero {
      inset: -4%;
      background-position: 43% 44%;
    }
  }

  @media (min-width: 1900px) {
    .hero {
      inset: -3%;
      background-position: 45% 45%;
      transform: translate3d(var(--px, 0px), var(--py, 0px), 0) scale(1.025);
    }
  }

  @media (min-aspect-ratio: 2.1/1) {
    .hero {
      inset: 0;
      background-size: auto 112%;
      background-position: 48% 46%;
    }
  }

  @media (max-width: 720px) {
    .site-nav {
      padding: 0.85rem 4vw;
      flex-wrap: wrap;
      gap: 0.45rem 1rem;
      background: linear-gradient(to bottom, rgba(5,7,11,0.85), transparent);
    }
    .nav-links {
      width: 100%;
      flex-wrap: wrap;
      gap: 0.55rem 0.9rem;
      font-size: 0.55rem;
      letter-spacing: 0.14em;
    }
    .stage {
      height: 100dvh;
      min-height: 100svh;
      cursor: default;
    }
    .hero {
      inset: -2%;
      /* keep silhouette + lighthouse readable on phone */
      background-position: 55% 40%;
      background-size: cover;
      transform: none !important;
      filter: saturate(1.04) contrast(1.03);
    }
    .vignette {
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%),
        linear-gradient(to top, rgba(0,0,0,0.35), transparent 30%);
    }
    .ui {
      left: 4vw;
      right: 4vw;
      bottom: max(5.5rem, 10dvh);
      max-width: none;
      gap: 0.65rem;
    }
    .ui .role {
      font-size: clamp(1.85rem, 9vw, 2.35rem);
    }
    .ui .chips { gap: 0.4rem; }
    .site-footer {
      left: 0;
      right: 0;
      bottom: 1.2rem;
      text-align: center;
      font-size: 0.58rem;
    }
  }
</style>
</head>
<body class="hero-page">
  <nav class="site-nav" aria-label="Primary">
    <a class="nav-mark" href="index.html">Nate Price</a>
    <ul class="nav-links">
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="work.html">Work</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="stage" id="stage">
    <div class="hero" id="hero"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="ui">
      <p class="role">Founder</p>
      <div class="chips">
        <span class="chip">Navy</span>
        <span class="chip">Maine</span>
        <span class="chip">EnkiLabs</span>
      </div>
    </div>
    <footer class="site-footer overlay">
      <nav class="footer-socials" aria-label="Social">
        <a href="https://www.linkedin.com/in/pricenj" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </nav>
      <p class="footer-mark">Built in Maine · EnkiLabs</p>
    </footer>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const hero = document.getElementById('hero');
    const finePointer = window.matchMedia('(pointer: fine) and (min-width: 721px)').matches;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (finePointer && !reduceMotion) {
      let tx = 0, ty = 0, cx = 0, cy = 0;
      stage.addEventListener('pointermove', (e) => {
        const r = stage.getBoundingClientRect();
        const nx = (e.clientX - r.left) / r.width - 0.5;
        const ny = (e.clientY - r.top) / r.height - 0.5;
        tx = nx * -3;
        ty = ny * -2;
      });
      stage.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
      function tick() {
        cx += (tx - cx) * 0.06;
        cy += (ty - cy) * 0.06;
        hero.style.setProperty('--px', cx.toFixed(2) + 'px');
        hero.style.setProperty('--py', cy.toFixed(2) + 'px');
        requestAnimationFrame(tick);
      }
      tick();
    }
  </script>
</body>
</html>
